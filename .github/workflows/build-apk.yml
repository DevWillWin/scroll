name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug, release, or all)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - all

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Environment & Keystores
        run: |
          # Create placeholder .env if not present
          touch .env
          
          # Restore or generate debug.keystore required by build.gradle.kts
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating new debug.keystore..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (Unsigned / Custom Signed)
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"
          KEY_ALIAS: "androiddebugkey"
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        if: ${{ always() && (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' || github.event_name != 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: ReelScroll-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        if: ${{ always() && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: ReelScroll-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: ignore
